services:
  - type: web
    name: primestack-101.6
    runtime: node
    region: singapore   # closest to UAE — change to "frankfurt" if preferred
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # set this manually in Render dashboard — never commit to git
      - key: TERMINAL_SECRET_KEY
        sync: false   # set this manually in Render dashboard
      - key: VAULT_KEY
        sync: false   # set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NMI_SECURITY_KEY
        sync: false
      - key: FINIX_USERNAME
        sync: false
      - key: FINIX_PASSWORD
        sync: false
      - key: WISE_API_KEY
        sync: false
      - key: WISE_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://primestack-dashboard.onrender.com"
      - key: ALERT_WEBHOOK
        value: ""
